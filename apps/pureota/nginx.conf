server {
    listen 80;
    server_name _;

    location = /healthz {
        default_type application/json;
        return 200 '{"status":"healthy","application":"pureota-dummy"}';
    }

    location = /runtime-status.json {
        default_type application/json;
        return 200 '{"status":"ok","application":"pureota-dummy","secret":"runtime-managed-by-key-vault"}';
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
