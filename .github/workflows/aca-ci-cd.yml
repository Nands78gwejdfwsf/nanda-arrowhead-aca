name: ACA Multi-App CI-CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      application:
        description: Application to deploy
        required: true
        default: all
        type: choice
        options: [all, pureota, helixbridge]

permissions:
  id-token: write
  contents: read
  issues: write

env:
  CONFIG_FILE: platform.json
  APPS_CONFIG: apps/apps.json

concurrency:
  group: aca-production
  cancel-in-progress: false

jobs:
  discover:
    name: Discover applications
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      resource_group: ${{ steps.platform.outputs.resource_group }}
      acr_name: ${{ steps.platform.outputs.acr_name }}
      acr_login_server: ${{ steps.platform.outputs.acr_login_server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Read platform configuration
        id: platform
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json
          c=json.load(open("platform.json", encoding="utf-8"))
          print("resource_group=" + c["resourceGroupName"])
          print("acr_name=" + c["acrName"])
          print("acr_login_server=" + c["acrLoginServer"])
          PY

      - name: Select changed applications
        id: select
        shell: bash
        env:
          REQUESTED_APP: ${{ github.event.inputs.application || '' }}
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, subprocess
          cfg=json.load(open("apps/apps.json", encoding="utf-8"))["applications"]
          requested=os.environ.get("REQUESTED_APP", "")
          event=os.environ.get("EVENT_NAME", "")
          before=os.environ.get("BEFORE_SHA", "")
          sha=os.environ["GITHUB_SHA"]
          if requested and requested != "all":
              if requested not in cfg: raise SystemExit(f"Unknown application: {requested}")
              selected=[requested]
          elif event == "workflow_dispatch":
              selected=list(cfg)
          else:
              changed=subprocess.check_output(["git","diff","--name-only",before,sha],text=True).splitlines() if before and before != "0"*40 else subprocess.check_output(["git","diff","--name-only","HEAD^","HEAD"],text=True).splitlines()
              selected=[]
              for name, app in cfg.items():
                  prefix=app["buildContext"].rstrip("/")+"/"
                  if any(p.startswith(prefix) for p in changed): selected.append(name)
              if "apps/apps.json" in changed or "platform.json" in changed: selected=list(cfg)
          matrix={"include":[{"app":n,**cfg[n]} for n in dict.fromkeys(selected)]}
          print(json.dumps(matrix,indent=2))
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("matrix="+json.dumps(matrix,separators=(",",":"))+"\n")
          PY

  build:
    name: Build ${{ matrix.displayName }}
    needs: discover
    if: ${{ needs.discover.outputs.matrix != '{"include":[]}' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        env:
          ACR_NAME: ${{ needs.discover.outputs.acr_name }}
        run: az acr login --name "$ACR_NAME"

      - name: Build immutable SHA image
        env:
          ACR_LOGIN_SERVER: ${{ needs.discover.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          image="$ACR_LOGIN_SERVER/${{ matrix.imageName }}:${GITHUB_SHA}"
          docker build --file "${{ matrix.dockerfile }}" --tag "$image" "${{ matrix.buildContext }}"
          docker push "$image"
          az acr repository show --name "${{ needs.discover.outputs.acr_name }}" --image "${{ matrix.imageName }}:${GITHUB_SHA}" --output none

  deploy:
    name: Deploy ${{ matrix.displayName }}
    needs: [discover, build]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Capture current serving revision
        id: current
        env:
          RESOURCE_GROUP: ${{ needs.discover.outputs.resource_group }}
        run: |
          set -euo pipefail
          current=$(az containerapp revision list -n "${{ matrix.containerAppName }}" -g "$RESOURCE_GROUP" --all --query "[?properties.trafficWeight > \`0\`].name | [0]" -o tsv)
          if [[ -z "$current" ]]; then
            echo "No existing serving revision was found. This is not expected after the foundation deployment."
            exit 1
          fi
          echo "current=$current" >> "$GITHUB_OUTPUT"

      - name: Deploy immutable image as a new internal revision
        env:
          RESOURCE_GROUP: ${{ needs.discover.outputs.resource_group }}
          ACR_LOGIN_SERVER: ${{ needs.discover.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          image="$ACR_LOGIN_SERVER/${{ matrix.imageName }}:${GITHUB_SHA}"
          az containerapp update \
            -n "${{ matrix.containerAppName }}" \
            -g "$RESOURCE_GROUP" \
            --image "$image" \
            --revision-suffix "${GITHUB_SHA:0:12}"
          az containerapp ingress update \
            -n "${{ matrix.containerAppName }}" \
            -g "$RESOURCE_GROUP" \
            --type internal \
            --target-port "${{ matrix.targetPort }}" \
            --transport auto

      - name: Find new revision
        id: revision
        env:
          RESOURCE_GROUP: ${{ needs.discover.outputs.resource_group }}
          ACR_LOGIN_SERVER: ${{ needs.discover.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          image="$ACR_LOGIN_SERVER/${{ matrix.imageName }}:${GITHUB_SHA}"
          for i in {1..30}; do
            rev=$(az containerapp revision list -n "${{ matrix.containerAppName }}" -g "$RESOURCE_GROUP" --all --query "[?properties.template.containers[0].image=='$image'].name | [0]" -o tsv)
            if [[ -n "$rev" ]]; then echo "revision=$rev" >> "$GITHUB_OUTPUT"; exit 0; fi
            sleep 10
          done
          exit 1

      - name: Keep old revision at 100 percent
        env:
          RESOURCE_GROUP: ${{ needs.discover.outputs.resource_group }}
        run: |
          set -euo pipefail
          az containerapp ingress traffic set \
            -n "${{ matrix.containerAppName }}" \
            -g "$RESOURCE_GROUP" \
            --revision-weight "${{ steps.current.outputs.current }}=100" "${{ steps.revision.outputs.revision }}=0"

      - name: Health gate on new revision
        env:
          RESOURCE_GROUP: ${{ needs.discover.outputs.resource_group }}
        run: |
          set -euo pipefail
          revision="${{ steps.revision.outputs.revision }}"
          for i in {1..36}; do
            status=$(az containerapp revision show -n "${{ matrix.containerAppName }}" -g "$RESOURCE_GROUP" --revision "$revision" --query '{health:properties.healthState,running:properties.runningState,provisioning:properties.provisioningState}' -o json)
            echo "$status"
            health=$(jq -r '.health // ""' <<< "$status")
            running=$(jq -r '.running // ""' <<< "$status")
            provisioning=$(jq -r '.provisioning // ""' <<< "$status")
            if [[ "$provisioning" == "Failed" || "$running" == "Failed" ]]; then exit 1; fi
            if [[ "$health" == "Healthy" && ("$running" == "Running" || "$running" == "RunningAtMaxScale") ]]; then exit 0; fi
            sleep 10
          done
          echo 'New revision did not become healthy.'
          exit 1

  approval:
    name: Production approval
    needs: deploy
    runs-on: ubuntu-latest
    environment:
      name: production
    steps:
      - run: echo 'Production approval received.'

  run-job:
    name: Run ${{ matrix.displayName }} Job
    needs: [discover, deploy, approval]
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - name: Skip when no Job is configured
        if: ${{ !matrix.jobEnabled }}
        run: echo 'No ACA Job configured.'

      - name: Azure login with OIDC
        if: ${{ matrix.jobEnabled }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Update Job to immutable SHA and start it
        if: ${{ matrix.jobEnabled }}
        id: start
        env:
          RESOURCE_GROUP: ${{ needs.discover.outputs.resource_group }}
          ACR_LOGIN_SERVER: ${{ needs.discover.outputs.acr_login_server }}
        shell: bash
        run: |
          set -euo pipefail
          image="$ACR_LOGIN_SERVER/${{ matrix.imageName }}:${GITHUB_SHA}"
          az containerapp job update -n "${{ matrix.jobName }}" -g "$RESOURCE_GROUP" --image "$image"
          execution=$(az containerapp job start -n "${{ matrix.jobName }}" -g "$RESOURCE_GROUP" --query name -o tsv)
          echo "execution=$execution" >> "$GITHUB_OUTPUT"

      - name: Wait for Job completion
        if: ${{ matrix.jobEnabled }}
        env:
          RESOURCE_GROUP: ${{ needs.discover.outputs.resource_group }}
        run: |
          set -euo pipefail
          for i in {1..36}; do
            status=$(az containerapp job execution show -n "${{ matrix.jobName }}" -g "$RESOURCE_GROUP" --job-execution-name "${{ steps.start.outputs.execution }}" --query properties.status -o tsv)
            echo "Job status: $status"
            case "$status" in
              Succeeded) exit 0 ;;
              Failed|Canceled) exit 1 ;;
            esac
            sleep 10
          done
          exit 1

  promote:
    name: Promote ${{ matrix.displayName }}
    needs: [discover, deploy, approval, run-job]
    if: ${{ always() && needs.deploy.result == 'success' && needs.approval.result == 'success' && needs.run-job.result == 'success' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Promote validated revision
        env:
          RESOURCE_GROUP: ${{ needs.discover.outputs.resource_group }}
          ACR_LOGIN_SERVER: ${{ needs.discover.outputs.acr_login_server }}
        run: |
          set -euo pipefail
          image="$ACR_LOGIN_SERVER/${{ matrix.imageName }}:${GITHUB_SHA}"
          revision=$(az containerapp revision list -n "${{ matrix.containerAppName }}" -g "$RESOURCE_GROUP" --all --query "[?properties.template.containers[0].image=='$image'].name | [0]" -o tsv)
          if [[ -z "$revision" ]]; then exit 1; fi
          az containerapp ingress traffic set -n "${{ matrix.containerAppName }}" -g "$RESOURCE_GROUP" --revision-weight "$revision=100"
          actual=$(az containerapp revision list -n "${{ matrix.containerAppName }}" -g "$RESOURCE_GROUP" --all --query "[?properties.trafficWeight == \`100\`].name | [0]" -o tsv)
          [[ "$actual" == "$revision" ]]

  notify:
    name: CI/CD failure notification
    needs: [discover, build, deploy, approval, run-job, promote]
    if: ${{ always() && contains(needs.*.result, 'failure') }}
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub failure notification
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ACA CI/CD failure - ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          body=$(cat <<EOF2
          ACA CI/CD deployment failed.

          Repository: $REPOSITORY
          Commit: $GITHUB_SHA
          Workflow: $GITHUB_WORKFLOW
          Run: $RUN_URL

          Review the failed GitHub Actions jobs before retrying or rolling back.
          EOF2
          )
          payload=$(jq -n --arg title "$TITLE" --arg body "$body" '{title:$title,body:$body}')
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/issues" \
            -d "$payload"
