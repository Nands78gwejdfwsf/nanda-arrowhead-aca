name: ACA Rollback

on:
  workflow_dispatch:
    inputs:
      application:
        description: Application to roll back
        required: true
        type: choice
        options:
          - pureota
          - helixbridge
      commit_sha:
        description: Full Git commit SHA to roll back to
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: aca-rollback
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback ${{ inputs.application }}
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read configuration
        id: config
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY' >> "$GITHUB_OUTPUT"
          import json

          with open("apps/apps.json", encoding="utf-8") as f:
              apps = json.load(f)["applications"]

          app = apps["${{ inputs.application }}"]

          print("containerAppName=" + app["containerAppName"])
          print("imageName=" + app["imageName"])
          PY

          python3 <<'PY' >> "$GITHUB_ENV"
          import json

          with open("platform.json", encoding="utf-8") as f:
              config = json.load(f)

          print("RESOURCE_GROUP=" + config["resourceGroupName"])
          print("ACR_LOGIN_SERVER=" + config["acrLoginServer"])
          print("ACR_NAME=" + config["acrName"])
          PY

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target image exists
        shell: bash
        run: |
          set -euo pipefail

          az acr repository show             --name "$ACR_NAME"             --image "${{ steps.config.outputs.imageName }}:${{ inputs.commit_sha }}"             --output none

          echo "Target image exists in ACR."

      - name: Find target revision
        id: target
        shell: bash
        run: |
          set -euo pipefail

          image="$ACR_LOGIN_SERVER/${{ steps.config.outputs.imageName }}:${{ inputs.commit_sha }}"

          revision=$(az containerapp revision list             --name "${{ steps.config.outputs.containerAppName }}"             --resource-group "$RESOURCE_GROUP"             --all             --query "[?properties.template.containers[0].image=='$image'].name | [0]"             --output tsv)

          if [[ -z "$revision" ]]; then
            echo "No revision exists for commit SHA ${{ inputs.commit_sha }}."
            echo "Rollback is intentionally refused."
            exit 1
          fi

          echo "Target revision: $revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

      - name: Validate target revision
        shell: bash
        run: |
          set -euo pipefail

          revision="${{ steps.target.outputs.revision }}"

          for i in {1..30}; do
            json=$(az containerapp revision show               --name "${{ steps.config.outputs.containerAppName }}"               --resource-group "$RESOURCE_GROUP"               --revision "$revision"               --query '{health:properties.healthState,running:properties.runningState,provisioning:properties.provisioningState}'               --output json)

            echo "$json"

            health=$(jq -r '.health' <<< "$json")
            running=$(jq -r '.running' <<< "$json")
            provisioning=$(jq -r '.provisioning' <<< "$json")

            if [[ "$provisioning" == "Failed" || "$running" == "Failed" ]]; then
              echo "Target revision is failed."
              exit 1
            fi

            if [[ "$health" == "Healthy" && ( "$running" == "Running" || "$running" == "RunningAtMaxScale" ) ]]; then
              echo "Target revision is healthy and running."
              exit 0
            fi

            sleep 10
          done

          echo "Target revision did not become healthy within the expected time."
          exit 1

      - name: Promote rollback revision
        shell: bash
        run: |
          set -euo pipefail

          revision="${{ steps.target.outputs.revision }}"

          echo "Rolling back application:"
          echo "${{ inputs.application }}"
          echo "Target revision:"
          echo "$revision"

          app_id=$(az containerapp show             --name "${{ steps.config.outputs.containerAppName }}"             --resource-group "$RESOURCE_GROUP"             --query id             --output tsv)

          traffic=$(az containerapp revision list             --name "${{ steps.config.outputs.containerAppName }}"             --resource-group "$RESOURCE_GROUP"             --all             --query "[?properties.active].name"             --output json |
            jq --arg target "$revision"               '[.[] | {revisionName: ., weight: (if . == $target then 100 else 0 end)}]')

          if [[ "$traffic" == "[]" ]]; then
            echo "No active revisions were found."
            exit 1
          fi

          echo "Applying rollback traffic configuration:"
          echo "$traffic"

          body=$(jq -n             --argjson traffic "$traffic"             '{properties:{configuration:{ingress:{traffic:$traffic}}}}')

          az rest             --method PATCH             --url "${app_id}?api-version=2025-07-01"             --body "$body"             --headers Content-Type=application/json

          echo "Waiting for traffic configuration to settle..."

          for i in {1..12}; do
            target_weight=$(az containerapp revision show               --name "${{ steps.config.outputs.containerAppName }}"               --resource-group "$RESOURCE_GROUP"               --revision "$revision"               --query properties.trafficWeight               --output tsv)

            echo "Target revision traffic: ${target_weight}%"

            if [[ "$target_weight" == "100" ]]; then
              non_target=$(az containerapp revision list                 --name "${{ steps.config.outputs.containerAppName }}"                 --resource-group "$RESOURCE_GROUP"                 --all                 --query "[?properties.trafficWeight > \`0\` && name != '$revision'].name | [0]"                 --output tsv)

              if [[ -z "$non_target" ]]; then
                echo "Rollback completed successfully."
                echo "100% traffic is now on:"
                echo "$revision"
                exit 0
              fi

              echo "Another revision still has traffic: $non_target"
            fi

            sleep 5
          done

          echo "Rollback traffic validation failed."
          echo "Expected revision: $revision"
          echo "Expected target traffic: 100%"
          echo "Actual target traffic: ${target_weight}%"
          exit 1

  notify:
    name: Rollback failure notification
    needs: rollback
    if: ${{ always() && needs.rollback.result == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Create GitHub failure notification
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          payload=$(jq -n             --arg title "ACA rollback failed - ${{ inputs.application }} - ${{ inputs.commit_sha }}"             --arg body "Rollback failed. Review the workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"             '{title:$title,body:$body}')

          curl -fsSL -X POST             -H "Authorization: Bearer $GH_TOKEN"             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/$REPOSITORY/issues"             -d "$payload"
