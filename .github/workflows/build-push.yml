name: Build and Push PureOTA

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ACR_LOGIN_SERVER: nandaacrarrowheadaca.azurecr.io
  IMAGE_NAME: pureota

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: |
          az acr login --name nandaacrarrowheadaca

      - name: Build Docker image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}

      - name: Display image
        run: |
          echo "Image pushed:"
          echo "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"